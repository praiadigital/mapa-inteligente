<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Inteligente — Preço/m² por cidade do litoral | Praia Digital</title>
<meta name="description" content="Mapa interativo do litoral paulista com preço por m², distância de SP e perfil de cada cidade.">
<link rel="canonical" href="https://praia.digital/mapa-inteligente/">
<style>:root{--azul:#0a2540;--mar:#0e7490;--areia:#f8f5ef}*{margin:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:var(--areia);color:#1e293b}header{background:linear-gradient(135deg,var(--azul),var(--mar));color:#fff;padding:2.5rem 1.5rem;text-align:center}.badge{display:inline-block;background:rgba(255,255,255,.15);padding:.25rem .8rem;border-radius:999px;font-size:.8rem;margin-bottom:.8rem}main{max-width:860px;margin:2rem auto;padding:0 1.25rem}.mapa{background:linear-gradient(180deg,#bae6fd,#e0f2fe);border-radius:1rem;padding:1.5rem;position:relative;margin-bottom:1.5rem}.linha{border-left:4px dashed #0284c7;margin-left:1rem;padding-left:1.5rem}.pt{position:relative;background:#fff;border-radius:.8rem;padding:1rem 1.2rem;margin-bottom:.8rem;box-shadow:0 2px 10px rgba(10,37,64,.08);cursor:pointer;border-left:5px solid var(--mar)}.pt::before{content:'📍';position:absolute;left:-2.1rem;top:1rem}.pt h3{display:flex;justify-content:space-between}.pt small{color:#64748b}.det{display:none;margin-top:.5rem;font-size:.85rem;color:#475569;border-top:1px dashed #e2e8f0;padding-top:.5rem}.m2{font-weight:800;color:var(--mar)}.rede{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.75rem}.rede a{background:#fff;border:1px solid #e2e8f0;border-radius:.6rem;padding:.8rem;text-decoration:none;color:var(--azul);font-weight:600;font-size:.9rem}footer{text-align:center;padding:2rem;color:#64748b;font-size:.85rem}footer a{color:var(--mar)}</style>
</head>
<body>
<header><span class="badge">🛰️ App satélite de <a href="https://praia.digital" style="color:#fff">praia.digital</a></span><h1>🗺️ Mapa Inteligente</h1><p>O litoral paulista de ponta a ponta — preços, distância e perfil</p></header>
<main>
<div class="mapa"><div class="linha" id="linha"></div></div>
<h2 style="margin:1.5rem 0 .8rem">🌐 Rede Praia Digital</h2>
<div class="rede">
<a href="https://praia.digital">🏠 Portal Praia Digital</a>
<a href="https://praia.digital/mapa-investidor">💼 Mapa do Investidor</a>
<a href="https://praia.digital/vizinho-digital">🏘️ Vizinho Digital</a>
<a href="https://praia.digital/avaliador-imoveis">🏠 Avaliador</a>
<a href="https://praia.digital/apps">🛰️ Todos os apps</a>
</div>
</main>
<footer>Feito com 🌊 pela rede <a href="https://praia.digital">Praia Digital</a> · <a href="https://github.com/praiadigital/mapa-inteligente">código aberto no GitHub</a></footer>
<script>
const D=[
['Peruíbe',180,3500,'O portal sul do litoral. Preços baixos, natureza preservada e a Estação Ecológica da Jureia.'],['Itanhaém',145,3500,'Cidade histórica com praias urbanas e crescimento imobiliário constante.'],['Mongaguá',130,3800,'Entrada mais barata do litoral; forte turismo de verão paulistano.'],['São Vicente',95,5200,'A primeira cidade do Brasil; mercado residencial consolidado.'],['Santos',80,10500,'A cidade mais completa do litoral: porto, serviços, cultura e praia urbana com jardim recorde.'],['Guarujá',95,9500,'A "Pérola do Atlântico": 27 praias, forte temporada e alta liquidez.'],['Bertioga / Riviera',130,14000,'Riviera é o condomínio mais valorizado do país; Bertioga, a porta de entrada.'],['São Sebastião',175,8200,'Maresias, Juquehy e Camburi: o eixo surf & natureza de alto padrão.'],['Caraguatatuba',185,5200,'Maior cidade do litoral norte; equilíbrio entre preço e estrutura.'],['Ubatuba',230,6500,'Mais de 100 praias, Mata Atlântica e o paraíso do turismo ecológico.']];
linha.innerHTML=D.map(([n,d,m2,p])=>`<div class="pt" onclick="this.querySelector('.det').style.display=this.querySelector('.det').style.display==='block'?'none':'block'"><h3>${n}<span class="m2">R$ ${m2.toLocaleString('pt-BR')}/m²</span></h3><small>${d} km de São Paulo</small><div class="det">${p}</div></div>`).join('');
</script>
</body></html>
