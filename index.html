<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa Inteligente — explore o litoral paulista bairro a bairro</title>
<meta name="description" content="Mapa interativo do litoral paulista com dados de preço, perfil e oportunidades por cidade. Satélite da rede praia.digital">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(180deg,#082f49,#0c4a6e);color:#e0f2fe;min-height:100vh}
header{padding:24px;text-align:center}
nav a{color:#fde047;margin:0 8px;text-decoration:none;font-size:14px}
.wrap{max-width:900px;margin:auto;padding:0 24px 24px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.city{fill:#38bdf8;stroke:#082f49;stroke-width:2;cursor:pointer;transition:fill .2s}
.city:hover{fill:#fde047}.city.on{fill:#f97316}
.clabel{font-size:13px;fill:#e0f2fe;pointer-events:none;font-weight:600}
#info{background:#0c4a6e;border-radius:16px;padding:22px;min-height:300px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#info h2{color:#fde047}
.stat{display:flex;justify-content:space-between;background:#082f49;border-radius:10px;padding:10px 14px;margin:8px 0}
.stat b{color:#7dd3fc}
.tagp{display:inline-block;background:#075985;border-radius:99px;padding:4px 12px;margin:3px;font-size:12px}
footer{padding:20px;text-align:center;font-size:13px;color:#7dd3fc}
footer a{color:#fde047}
</style></head>
<body>
<header><h1>🗺️ Mapa Inteligente do Litoral</h1><p>Toque em uma cidade para explorar os dados</p>
<nav><a href="https://praia.digital">Praia Digital</a><a href="https://praia.digital/radar-precos">Radar de Preços</a><a href="https://praia.digital/guia-litoral">Guia do Litoral</a><a href="https://praia.digital/apps">Todos os apps</a></nav></header>
<div class="wrap">
<svg viewBox="0 0 420 460" style="width:100%">
<rect x="0" y="0" width="420" height="460" rx="18" fill="#075985" opacity=".45"/>
<text x="20" y="30" fill="#7dd3fc" font-size="13">Oceano Atlântico 🌊</text>
<g id="g"></g>
</svg>
<div id="info"><h2>👈 Escolha uma cidade</h2><p>Dados de preço médio, perfil do mercado e melhores usos (morar, investir, temporada).</p></div>
</div>
<footer>Rede <a href="https://praia.digital">praia.digital</a> · <a href="https://praia.digital/match-praia">Match Praia</a> · <a href="https://praia.digital/marea">Maréa</a> · <a href="https://praia.digital/investidores-litoral">Investidores</a></footer>
<script>
const cidades=[
{n:'São Sebastião',x:320,y:60,preco:13500,perfil:'Premium / surf',tags:['Maresias','Riviera','valorização alta','náutica'],nota:'Mercado mais valorizado do litoral norte. Riviera lidera em R$/m².'},
{n:'Caraguatatuba',x:230,y:110,preco:6800,perfil:'Custo-benefício',tags:['famílias','Martim de Sá','comércio forte'],nota:'Porta de entrada do litoral norte: preços acessíveis e demanda crescente.'},
{n:'Ubatuba',x:380,y:30,preco:8200,perfil:'Natureza / ecoturismo',tags:['100+ praias','Itamambuca','temporada forte'],nota:'Paraíso ecológico com alta procura por casas de temporada.'},
{n:'Guarujá',x:150,y:280,preco:9800,perfil:'Tradicional / urbano',tags:['Pitangueiras','Enseada','pé na areia'],nota:'O clássico da Baixada: liquidez alta e temporada o ano todo.'},
{n:'Santos',x:210,y:300,preco:11800,perfil:'Urbano / premium',tags:['Gonzaga','Boqueirão','orla famosa'],nota:'Melhor infraestrutura do litoral; aluguel anual e temporada fortes.'},
{n:'Praia Grande',x:120,y:330,preco:7000,perfil:'Popular / volume',tags:['alto giro','Canto do Forte','investidor entry'],nota:'Maior volume de transações; ideal para primeiro investimento.'}];
const g=document.getElementById('g');
cidades.forEach((c,i)=>{g.innerHTML+=`<circle class="city" id="c${i}" cx="${c.x}" cy="${c.y}" r="16" onclick="sel(${i})"/><text class="clabel" x="${c.x+22}" y="${c.y+4}">${c.n}</text>`;});
function sel(i){const c=cidades[i];document.querySelectorAll('.city').forEach(e=>e.classList.remove('on'));document.getElementById('c'+i).classList.add('on');
info.innerHTML=`<h2>${c.n}</h2><div class="stat"><span>Preço médio</span><b>R$ ${c.preco.toLocaleString('pt-BR')}/m²</b></div><div class="stat"><span>Perfil</span><b>${c.perfil}</b></div><p>${c.nota}</p><div>${c.tags.map(t=>`<span class="tagp">${t}</span>`).join('')}</div><p style="margin-top:14px"><a style="color:#fde047" href="https://praia.digital/radar-precos">Ver bairros no Radar →</a> · <a style="color:#fde047" href="https://praia.digital/match-praia">Imóveis no Match →</a></p>`;}
</script></body></html>
